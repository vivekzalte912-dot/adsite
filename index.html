<!DOCTYPE html>
<html lang="hi">
<head>
    <!-- AdSense Verification Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7892775966071062"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Revenue Hub</title>
    <style>
        :root {
            --bg-color: #030508;
            --panel-color: #090d16;
            --text-color: #fffafc;
            --accent-color: #06b6d4;
            --border-color: #1e293b;
            --success-color: #10b981;
            --ad-bg: #090d16;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: var(--accent-color);
            margin-bottom: 5px;
            font-size: 1.4rem;
        }
        .google-ad-slot {
            background-color: var(--ad-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.85rem;
        }
        .btn {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 0.9rem;
            color: var(--success-color);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ad Revenue Hub</h2>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px;">
            नीचे दिए गए बटन पर क्लिक करके विज्ञापन देखें। जितनी बार आप विज्ञापन देखेंगे, आपके एड्सेंस अकाउंट पर इम्प्रेशंस बढ़ेंगे और आपकी कमाई होगी।
        </p>

        <!-- Top Ad Banner Space -->
        <div class="google-ad-slot">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7892775966071062"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <button class="btn" onclick="loadAd()">विज्ञापन लोड करें और देखें</button>
        <div class="status-msg" id="statusText">सिस्टम तैयार है। विज्ञापन देखने के लिए ऊपर क्लिक करें!</div>

        <!-- Bottom Ad Banner Space -->
        <div class="google-ad-slot" style="margin-top: 20px;">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-7892775966071062"
                 data-ad-slot="auto"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <script>
        function loadAd() {
            const status = document.getElementById('statusText');
            status.innerHTML = "विज्ञापन लोड हो रहा है (Ad Impression काउंट हो रहा है)...";
            
            // Re-trigger AdSense push if needed or simulate refresh
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch(e) {
                console.log(e);
            }

            setTimeout(() => {
                status.innerHTML = "⚠️ विज्ञापन सफलतापूर्वक देख लिया गया! आपका रेवेन्यू अपडेट हो गया है।";
            }, 1500);
        }
    </script>
</body>
</html>
